<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLAVIS Clinical Dashboard</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --border: #1f2a44;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: 0.5px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 8px; }
  h2 { margin: 0 0 10px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .status { display: flex; gap: 8px; }
  .badge {
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.on { color: var(--green); border-color: var(--green); }
  .badge.off { color: var(--amber); border-color: var(--amber); }
  .badge.demo { color: var(--blue); border-color: var(--blue); }
  .banner {
    margin: 16px 24px 0;
    padding: 14px 18px;
    border-radius: 8px;
    background: rgba(239, 68, 68, 0.18);
    border: 1px solid var(--red);
    color: #fecaca;
    font-weight: 600;
    animation: pulse 1s ease-in-out infinite;
  }
  .hidden { display: none; }
  @keyframes pulse { 50% { background: rgba(239, 68, 68, 0.35); } }
  main { padding: 16px 24px 32px; display: grid; gap: 16px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .card, .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .card .value { font-size: 30px; font-weight: 700; margin-top: 6px; }
  .card .unit { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
  .value.ok { color: var(--green); }
  .value.warn { color: var(--amber); }
  .value.bad { color: var(--red); }
  .chart-wrap { position: relative; height: 320px; }
  .caption { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .alerts-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .alerts-head h2 { margin: 0; }
  button {
    background: var(--red);
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { transform: scale(0.98); }
  ul { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
  li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 8px 10px;
    margin-bottom: 6px;
    border-radius: 6px;
    border-left: 4px solid var(--muted);
    background: rgba(255, 255, 255, 0.03);
    font-size: 13px;
  }
  li.security { border-left-color: var(--red); background: rgba(239, 68, 68, 0.12); }
  li.physiological { border-left-color: var(--amber); background: rgba(245, 158, 11, 0.08); }
  li .tag { font-weight: 700; min-width: 160px; }
  li.security .tag { color: var(--red); }
  li.physiological .tag { color: var(--amber); }
  li .time { margin-left: auto; color: var(--muted); white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>CLAVIS <span>Cardiac Telemetry Monitor</span></h1>
  <div class="status">
    <span class="badge demo">DEMO MODE</span>
    <span id="conn" class="badge off">Disconnected</span>
    <span id="fresh" class="badge off">Waiting for data</span>
  </div>
</header>

<div id="banner" class="banner hidden"></div>

<main>
  <section class="cards">
    <div class="card"><div class="label">Heart rate</div><div class="value" id="bpm">--<span class="unit">BPM</span></div></div>
    <div class="card"><div class="label">RR interval</div><div class="value" id="rr">--<span class="unit">ms</span></div></div>
    <div class="card"><div class="label">Rhythm</div><div class="value" id="rhythm">--</div></div>
    <div class="card"><div class="label">Frames / sec</div><div class="value" id="fps">0</div></div>
    <div class="card"><div class="label">Security alerts</div><div class="value ok" id="secCount">0</div></div>
  </section>

  <section class="panel">
    <h2>ECG waveform</h2>
    <div class="chart-wrap"><canvas id="ecg"></canvas></div>
    <div class="caption">Last frame sequence: <span id="seq">--</span></div>
  </section>

  <section class="panel">
    <div class="alerts-head">
      <h2>Alerts</h2>
      <button id="attack" type="button">Simulate attack</button>
    </div>
    <ul id="alerts"></ul>
    <div id="noAlerts" class="empty">No alerts yet.</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script>
  const MAX_POINTS = 1080;
  const MAX_ALERTS = 50;
  const BANNER_MS = 15000;
  const ecgBuffer = new Array(MAX_POINTS).fill(null);
  let bannerTimer = null;

  const chart = new Chart(document.getElementById('ecg'), {
    type: 'line',
    data: {
      labels: new Array(MAX_POINTS).fill(''),
      datasets: [{
        data: ecgBuffer,
        borderColor: '#22c55e',
        borderWidth: 1.5,
        pointRadius: 0,
        tension: 0
      }]
    },
    options: {
      animation: false,
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { display: false },
        y: {
          suggestedMin: -0.5,
          suggestedMax: 1.5,
          ticks: { color: '#9ca3af' },
          grid: { color: '#1f2a44' },
          title: { display: true, text: 'mV', color: '#9ca3af' }
        }
      },
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    }
  });

  const socket = io();

  socket.on('connect', () => {
    document.getElementById('conn').textContent = 'Connected';
    document.getElementById('conn').className = 'badge on';
    document.getElementById('fresh').textContent = 'Live data';
    document.getElementById('fresh').className = 'badge on';
  });

  socket.on('disconnect', () => {
    document.getElementById('conn').textContent = 'Disconnected';
    document.getElementById('conn').className = 'badge off';
    document.getElementById('fresh').textContent = 'Waiting for data';
    document.getElementById('fresh').className = 'badge off';
  });

  socket.on('telemetry', (data) => {
    if (data.bpm != null) {
      document.getElementById('bpm').innerHTML = Math.round(data.bpm) + '<span class="unit">BPM</span>';
    }
    const rrVal = data.rr_ms != null ? data.rr_ms : data.rr;
    if (rrVal != null) {
      document.getElementById('rr').innerHTML = Math.round(rrVal) + '<span class="unit">ms</span>';
    }
    const rhythmVal = data.classification || data.rhythm;
    if (rhythmVal) {
      const rEl = document.getElementById('rhythm');
      rEl.textContent = rhythmVal;
      rEl.className = 'value ' + (rhythmVal === 'NORMAL' ? 'ok' : 'warn');
    }
    const fpsVal = data.count != null ? Math.round(data.count / 0.25) : data.fps;
    if (fpsVal != null) {
      document.getElementById('fps').textContent = fpsVal;
    }
    const seqVal = data.last_seq != null ? data.last_seq : data.seq;
    if (seqVal != null) {
      document.getElementById('seq').textContent = seqVal;
    }

    const incoming = data.samples || data.ecg || data.waveform;
    if (Array.isArray(incoming) && incoming.length > 0) {
      for (let i = 0; i < incoming.length; i++) {
        ecgBuffer.push(incoming[i]);
      }
      while (ecgBuffer.length > MAX_POINTS) {
        ecgBuffer.shift();
      }
      chart.update('none');
    }
  });

  function renderAlert(msg) {
    const ul = document.getElementById('alerts');
    const empty = document.getElementById('noAlerts');
    if (empty) empty.classList.add('hidden');

    const category = msg.category || msg.type || 'security';
    const tag = msg.event_type || msg.tag || 'SECURITY ALERT';
    const desc = msg.detail || msg.desc || 'Replay Attack Blocked [Sequence ID Duplicate]';
    const timeStr = msg.ts ? new Date(msg.ts).toLocaleTimeString() : new Date().toLocaleTimeString();

    const li = document.createElement('li');
    li.className = category === 'security' ? 'security' : 'physiological';
    li.innerHTML = `<span class="tag">${tag}</span> <span class="desc">${desc}</span> <span class="time">${timeStr}</span>`;

    ul.prepend(li);
    while (ul.children.length > MAX_ALERTS) {
      ul.lastChild.remove();
    }

    if (category === 'security') {
      const banner = document.getElementById('banner');
      banner.textContent = `SECURITY WARNING: ${tag} — ${desc}`;
      banner.classList.remove('hidden');

      const secEl = document.getElementById('secCount');
      const secCount = (parseInt(secEl.textContent, 10) || 0) + 1;
      secEl.textContent = secCount;
      secEl.className = 'value bad';

      if (bannerTimer) clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => banner.classList.add('hidden'), BANNER_MS);
    }
  }

  socket.on('alert', (msg) => {
    renderAlert(msg);
  });

  socket.on('history', (items) => {
    if (Array.isArray(items)) {
      items.forEach(item => renderAlert(item));
    }
  });

  const attackBtn = document.getElementById('attack');
  if (attackBtn) {
    attackBtn.addEventListener('click', () => {
      fetch('/demo/attack', { method: 'POST' }).catch(() => {
        socket.emit('simulate_attack');
      });
    });
  }
</script>
</body>
</html>
